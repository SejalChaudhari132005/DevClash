server.port=${SERVER_PORT:8085}
spring.application.name=devclash-gateway

# Reverse proxy support (Nginx / Cloudflare / AWS ALB SSL termination)
server.forward-headers-strategy=framework

# Native SSL termination support (optional direct HTTPS/WSS)
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}

# Production CORS & WebSocket Origin Restriction (comma-separated, or * for open)
devclash.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# RMI Server connection properties
devclash.rmi.host=${RMI_SERVER_HOST:127.0.0.1}
devclash.rmi.port=${RMI_SERVER_PORT:1099}
devclash.rmi.service-name=${RMI_SERVICE_NAME:DevClashQuizService}

# RMI Callback listener properties for distributed multi-host/container deployment
devclash.rmi.callback-port=${RMI_CALLBACK_PORT:0}
devclash.rmi.callback-host=${RMI_CALLBACK_HOST:}

# Logging configuration
logging.level.com.devclash.gateway=INFO
logging.level.org.springframework.web.socket=INFO
