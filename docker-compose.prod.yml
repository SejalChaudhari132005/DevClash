version: '3.8'

# ==============================================================================
# DEVCLASH - PRODUCTION DOCKER COMPOSE ORCHESTRATION
# Complete Multi-Tier Deployment with Strict Network Security & Port Isolation
# ==============================================================================

networks:
  public-facing:
    driver: bridge
  internal-backend:
    driver: bridge
    internal: true # No external internet access; restricted to internal containers

volumes:
  mysql_data:
  nginx_ssl:

services:
  # ----------------------------------------------------------------------------
  # Tier 4: Managed Persistence (MySQL 8.0)
  # Isolated within internal-backend network; no external ports exposed.
  # ----------------------------------------------------------------------------
  database:
    image: mysql:8.0
    container_name: devclash-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sejal@132005}
      MYSQL_DATABASE: ${DB_NAME:-devclash_db}
      MYSQL_USER: ${DB_USER:-devclash_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devclash_secure_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_questions.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    networks:
      - internal-backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Tier 3: Distributed Computing (Java RMI Quiz Server)
  # Exports QuizRemote remote object on port 1098 & Registry on 1099.
  # Strictly isolated inside internal-backend network; only Gateway can reach it.
  # ----------------------------------------------------------------------------
  rmi-server:
    build:
      context: .
      dockerfile: Dockerfile.rmi-server
    container_name: devclash-rmi-server
    restart: unless-stopped
    environment:
      RMI_HOST: rmi-server
      RMI_PORT: 1099
      RMI_OBJECT_PORT: 1098
      RMI_SERVICE_NAME: DevClashQuizService
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-devclash_db}
      DB_USER: ${DB_USER:-devclash_user}
      DB_PASSWORD: ${DB_PASSWORD:-devclash_secure_pass_2026}
    networks:
      - internal-backend
    depends_on:
      database:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Tier 2: Public Security DMZ & Relay (Spring Boot Gateway)
  # Bridges public-facing and internal-backend networks.
  # Connects to RMI Server internally; handles STOMP WebSockets and REST.
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: devclash-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      RMI_SERVER_HOST: rmi-server
      RMI_SERVER_PORT: 1099
      RMI_SERVICE_NAME: DevClashQuizService
      RMI_CALLBACK_PORT: 1097
      RMI_CALLBACK_HOST: gateway
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    networks:
      - public-facing
      - internal-backend
    depends_on:
      - rmi-server

  # ----------------------------------------------------------------------------
  # Tier 1: Public Entrypoint & Reverse Proxy (Nginx + React SPA)
  # Serves production React bundle, terminates TLS (HTTPS/WSS), and routes /api & /ws.
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: devclash-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_ssl:/etc/nginx/ssl:ro
    networks:
      - public-facing
    depends_on:
      - gateway
